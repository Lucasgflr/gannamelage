name: Deploy da demonstração para GitHub Pages

on:
  push:
    branches: [feat/react-mobile-first]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gannamelage-demo-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/feat/react-mobile-first'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    outputs:
      pages_enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npx playwright install --with-deps chromium
      - run: npm run test:demo
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-demo
      - name: Verificar origem configurada no Pages
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          build_type=$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.build_type') || build_type=''
          if [[ "$build_type" == workflow ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::O deploy aguarda a seleção de GitHub Actions como origem do Pages."
          fi

  deploy:
    needs: build
    if: needs.build.outputs.pages_enabled == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
